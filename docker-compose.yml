version: '3.8'

services:
  # Infrastructure Services
  postgres:
    image: postgres:13
    container_name: multi-tenant-postgres
    environment:
      POSTGRES_DB: multi_tenant_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d multi_tenant_db"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - multi-tenant-network

  redis:
    image: redis:alpine
    container_name: multi-tenant-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - multi-tenant-network

  # Application Services
  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    container_name: multi-tenant-auth
    environment:
      - DATABASE_URL=postgresql://admin:admin123@postgres:5432/multi_tenant_db
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-super-secret-key-change-in-production}
      - REDIS_URL=redis://redis:6379
    ports:
      - "8001:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - multi-tenant-network

  connector-service:
    build:
      context: ./services/connector-service
      dockerfile: Dockerfile
    container_name: multi-tenant-connector
    environment:
      - AUTH_SERVICE_URL=http://auth-service:8000
      - DATABASE_URL=postgresql://admin:admin123@postgres:5432/multi_tenant_db
    ports:
      - "8002:8000"
    depends_on:
      auth-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - multi-tenant-network

  pipeline-service:
    build:
      context: ./services/pipeline-service
      dockerfile: Dockerfile
    container_name: multi-tenant-pipeline
    environment:
      - AUTH_SERVICE_URL=http://auth-service:8000
      - CONNECTOR_SERVICE_URL=http://connector-service:8000
      - DATABRICKS_WORKSPACE_URL=${DATABRICKS_WORKSPACE_URL}
      - DATABRICKS_TOKEN=${DATABRICKS_TOKEN}
    ports:
      - "8003:8000"
    depends_on:
      connector-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - multi-tenant-network

  catalog-service:
    build:
      context: ./services/catalog-service
      dockerfile: Dockerfile
    container_name: multi-tenant-catalog
    environment:
      - AUTH_SERVICE_URL=http://auth-service:8000
      - DATABASE_URL=postgresql://admin:admin123@postgres:5432/multi_tenant_db
      - UNITY_CATALOG_ENABLED=${UNITY_CATALOG_ENABLED:-false}
    ports:
      - "8004:8000"
    depends_on:
      auth-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - multi-tenant-network

  data-quality-service:
    build:
      context: ./services/data-quality-service
      dockerfile: Dockerfile
    container_name: multi-tenant-data-quality
    environment:
      - AUTH_SERVICE_URL=http://auth-service:8000
      - PIPELINE_SERVICE_URL=http://pipeline-service:8000
      - DATABASE_URL=postgresql://admin:admin123@postgres:5432/multi_tenant_db
    ports:
      - "8005:8000"
    depends_on:
      pipeline-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - multi-tenant-network

  # API Gateway
  nginx:
    image: nginx:alpine
    container_name: multi-tenant-gateway
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/ssl:/etc/nginx/ssl
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - auth-service
      - connector-service
      - pipeline-service
      - catalog-service
      - data-quality-service
    restart: unless-stopped
    networks:
      - multi-tenant-network

  # Monitoring
  prometheus:
    image: prom/prometheus:latest
    container_name: multi-tenant-prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    ports:
      - "9090:9090"
    networks:
      - multi-tenant-network

  grafana:
    image: grafana/grafana:latest
    container_name: multi-tenant-grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - multi-tenant-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

networks:
  multi-tenant-network:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.20.0.0/16
